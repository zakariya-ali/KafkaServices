name: spring-kafka-microservices

services:

  # ---------------------------------------------------------------------------
  # Apache Kafka - single broker in KRaft mode (no ZooKeeper).
  # The same process acts as "broker" (stores messages) and "controller"
  # (manages cluster metadata, the job ZooKeeper used to do).
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    hostname: kafka
    ports:
      # Only the EXTERNAL listener is published to your machine.
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Three listeners = three "doors" into the broker:
      #   INTERNAL   :9092  - other containers on the Docker network (kafka:9092)
      #   EXTERNAL   :29092 - apps running on your host, e.g. IntelliJ (localhost:29092)
      #   CONTROLLER :9093  - KRaft controller traffic
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # What the broker tells clients to connect to after the first contact.
      # This is why containers must use kafka:9092 and host apps localhost:29092.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker → internal topics can only have 1 replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # Keep messages for 7 days, whether or not they have been consumed.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - kafka-net
    healthcheck:
      # "Ready" = the broker answers API requests, not merely "the container started".
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Order Producer - REST API on localhost:8081
  # ---------------------------------------------------------------------------
  order-producer:
    build: ./order-producer-service   # built from the Dockerfile, Maven runs inside Docker
    image: order-producer-service:latest
    container_name: order-producer
    ports:
      - "${PRODUCER_PORT:-8081}:8081"
    environment:
      # Inside the Docker network Kafka is reached by its SERVICE NAME, not localhost.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_TOPIC: ${ORDER_TOPIC:-order-events}
    depends_on:
      kafka:
        condition: service_healthy   # wait until Kafka's health check passes
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Order Consumer - no business API; port 8082 exposes /actuator/health
  # ---------------------------------------------------------------------------
  order-consumer:
    build: ./order-consumer-service
    image: order-consumer-service:latest
    container_name: order-consumer
    ports:
      - "${CONSUMER_PORT:-8082}:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_TOPIC: ${ORDER_TOPIC:-order-events}
      CONSUMER_GROUP_ID: ${CONSUMER_GROUP_ID:-order-processing-group}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  # Named volume: survives `docker compose down`; removed only by `docker compose down -v`.
  kafka-data:

networks:
  kafka-net:
    driver: bridge
